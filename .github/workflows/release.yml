name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the version-bump commit / create the release
      pull-requests: write # to open the "Version Packages" PR
      id-token: write # for npm Trusted Publishing (OIDC) + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing (OIDC) needs npm >= 11.5.1. Node 24 ships an 11.x,
      # but upgrade to be sure we're above the minimum.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Opens/updates a "Version Packages" PR when changesets are present.
      # When that PR is merged (versions bumped, changesets consumed), the same
      # step instead runs `npm run release` to publish to npm. Auth is via
      # Trusted Publishing (OIDC) — no NPM_TOKEN secret; npm exchanges the
      # id-token minted per run for a short-lived publish credential.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
